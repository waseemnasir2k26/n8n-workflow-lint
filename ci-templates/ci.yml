name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  selflint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint vendored workflows from waseemnasir2k26/n8n-workflows
        run: node bin/cli.js examples/vendored --fail-on critical
      - name: Write reports
        if: always()
        run: |
          node bin/cli.js examples/vendored --format sarif --out lint.sarif --fail-on critical
          node bin/cli.js examples/vendored --format md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n8n-lint-sarif
          path: lint.sarif
